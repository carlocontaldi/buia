x-logging: &logging              # Docker keeps container logs forever unless told otherwise: keep the newest 60 MB per service
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13@sha256:222d8eeee19c4407a0ad00eec534dc5d372c706c4c67f58e3993a25ed8ed3d3e   # pinned to the build known to work (2026-11-06); RTX 50-series + CUDA 13 driver. Older driver: use :server-cuda and drop the digest
    restart: unless-stopped
    logging: *logging
    environment:
      LLAMA_CACHE: /models            # downloaded models live in this named volume
      HF_TOKEN: ${HF_TOKEN:-}         # only needed for gated Hugging Face repos
    volumes:
      - models:/models
    # Router mode: no -m / -hf here. Models are downloaded, loaded and switched from the web UI.
    # -ngl is left unset on purpose: llama.cpp's default --fit then offloads only as much as fits in VRAM.
    # --models-max 1: one model in VRAM at a time. --no-mmproj: text only, skips vision projector files.
    # NB: no '#' comments inside the command block below, YAML would pass them to llama-server as arguments.
    command: >-
      --jinja
      -c ${CTX_SIZE:-16384}
      -np 1
      --flash-attn on
      -ctk ${KV_CACHE_TYPE:-q8_0} -ctv ${KV_CACHE_TYPE:-q8_0}
      --models-max 1
      --no-mmproj
      --host 0.0.0.0 --port 8080
      ${LLAMA_EXTRA_ARGS:-}
    # no "ports:" on purpose: only the agent container can reach llama-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  agent:
    build: ./agent
    restart: unless-stopped
    logging: *logging
    depends_on: [llama]
    environment:
      LLAMA_URL: http://llama:8080
      CTX_SIZE: ${CTX_SIZE:-16384}     # same values as llama-server: the agent trims prompts and sizes KV estimates with them
      KV_CACHE_TYPE: ${KV_CACHE_TYPE:-q8_0}
      HF_TOKEN: ${HF_TOKEN:-}
      GPU_VRAM_MB: ${GPU_VRAM_MB:-}    # optional manual VRAM size if nvidia-smi is not visible in this container
      MEMORY_FILES: ${MEMORY_FILES:-workspace/BUIA.md}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}   # extra host names the web UI may be opened under (localhost, 127.0.0.1 and *.ts.net always work)
      TZ: ${TZ:-UTC}
      BUIA_PASSWORD: ${BUIA_PASSWORD:-}   # web UI login password; empty = nobody can log in
      NVIDIA_DRIVER_CAPABILITIES: utility   # only nvidia-smi (to read VRAM for the model fit check), no compute
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:8000:8000"         # loopback only; Tailscale Serve exposes it to your tailnet
    volumes:
      - type: bind
        source: ${BUIA_PATH}
        target: /data/workspace
      - type: bind
        source: ${VAULT_PATH}
        target: /data/vault
        read_only: true                 # the agent can read the vault but never change it
      - type: bind
        source: ./sdmodels              # image/video model files: the Models panel downloads them here (sd and sd-video mount the same folder read-only)
        target: /data/sdmodels          # outside the workspace and the vault, so the model's file tools cannot reach it
        bind:
          create_host_path: true

  sd:
    profiles: ["sd"]
    build:
      context: ./sdcpp
      dockerfile: docker/Dockerfile.cuda
      args:
        CUDA_VERSION: "12.8.1"       # Dockerfile default is 12.6.3; Blackwell needs CUDA >= 12.8
        CUDA_ARCHITECTURES: "120"    # RTX 5050 should be compute capability 12.0: nvidia-smi --query-gpu=compute_cap --format=csv,noheader
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "-c"]
    # Model flags: sdmodels/active-image.args (written by "Use" in the Models panel) wins; without it SD_ARGS from .env (one line) is used.
    # sd-run.sh restarts sd-server when that file changes. The hand-written examples (Z-Image Turbo for images, Wan 2.1 T2V 1.3B for video)
    # are in .env.example; the Models panel has the same two as presets (agent/sdmodels.py): keep them equal.
    # --lora-model-dir matters: it defaults to "." and the server scans it recursively on /capabilities AND on every img_gen/vid_gen request.
    # The container's working dir is /, so the default scan walks /proc and fails with HTTP 500. /models/loras may simply not exist (scan is skipped).
    # -v makes sd.cpp log the "compute buffer size" lines. Read them with: docker compose logs sd | findstr /c:"compute buffer"
    # sd-run.sh passes TERM on to sd-server, so docker stop still ends it cleanly. exec: the script replaces the shell.
    command: ["exec /bin/sh /sd-run.sh /models/active-image.args ${SD_ARGS:-}"]
    volumes:
      - type: bind
        source: ./sd-run.sh
        target: /sd-run.sh
        read_only: true
      - type: bind
        source: ./sdmodels   # relative to the folder holding this compose file (buia-stack), next to ./sdcpp
        target: /models
        read_only: true
    # no "ports:" on purpose: only the agent container should reach sd-server
    logging: *logging                # -v is chatty, so this one matters most
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Second sd-server for video: same image, volumes and GPU settings as sd (extends), but its own model flags
  # (SD_VIDEO_ARGS in .env, one line). One sd-server loads one model, so images (sd) and video (sd-video)
  # need separate instances; the agent reaches them as http://sd:1234 and http://sd-video:1234.
  sd-video:
    extends:
      service: sd
    command: ["exec /bin/sh /sd-run.sh /models/active-video.args ${SD_VIDEO_ARGS:-}"]

volumes:
  models:
