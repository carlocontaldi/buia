name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"  # the version of the agent image
      # --no-deps: the lock lists every package with hashes; without it pip also wants unlisted extras of a platform (colorama for click on Windows)
      - name: Install the locked agent requirements
        run: python -m pip install --no-deps --require-hashes -r agent/requirements.txt
      - name: Run the tests
        run: python -m unittest discover -s tests -v
