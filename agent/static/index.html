<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUIA — Your standalone AI assistant</title>
<link rel="icon" href="/buia-mark.svg" type="image/svg+xml">
<meta name="theme-color" content="#07100c">
<style>
  :root {
    color-scheme: dark;
    --bg: #07100c;
    --surface: #0c1912;
    --surface-raised: #102219;
    --surface-soft: #14291d;
    --fg: #edf6ef;
    --muted: #8fa99a;
    --line: #244632;
    --accent: #69f0a0;
    --accent-strong: #28c96b;
    --accent-wash: #143b27;
    --danger: #fb7185;
    --me: #123d29;
    --bot: #102219;
    --shadow: 0 18px 60px #0008;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background:
      radial-gradient(ellipse at 82% 0%, #0d3b25aa 0, transparent 36rem),
      radial-gradient(ellipse at 8% 90%, #0b281a88 0, transparent 34rem),
      var(--bg);
    color: var(--fg); font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    position: relative; z-index: 3; display: flex; align-items: center; gap: 10px;
    min-height: 66px; padding: 10px clamp(14px, 3vw, 34px);
    border-bottom: 1px solid #294b37aa; background: #07120ddd; backdrop-filter: blur(18px);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: max-content; margin-right: 12px; }
  .brand img { width: 38px; height: 38px; filter: drop-shadow(0 0 10px #45e98555); }
  .brand-name { font-size: 18px; font-weight: 760; letter-spacing: .13em; }
  .brand-name span { color: var(--accent); }
  .top-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  #msel {
    flex: 1; min-width: 110px; max-width: 310px; font: inherit; font-size: 13px; color: var(--fg);
    background: var(--surface-raised); border: 1px solid var(--line); border-radius: 11px; padding: 8px 34px 8px 11px;
  }
  #thinkl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  input[type="checkbox"] { accent-color: var(--accent-strong); }
  #status { font-size: 12px; color: var(--muted); padding: 7px clamp(16px, 3vw, 36px); border-bottom: 1px solid #24463277; background: #09150f99; }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 22px clamp(14px, 5vw, 72px); scroll-behavior: smooth; }
  #welcome { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 34px 16px 54px; }
  #welcome img { width: 94px; height: 94px; margin-bottom: 20px; filter: drop-shadow(0 0 28px #31e97844); }
  #welcome h1 { margin: 0; font-size: clamp(32px, 5vw, 48px); line-height: 1.1; letter-spacing: -.045em; font-weight: 720; }
  #welcome h1 span { color: var(--accent); }
  #welcome p { max-width: 490px; margin: 14px 0 0; color: var(--muted); font-size: 15px; }
  .welcome-rule { width: min(240px, 42vw); height: 2px; margin: 25px 0 0; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .8; }
  .m { max-width: min(850px, 92%); margin: 14px 0; padding: 12px 16px; border: 1px solid #294b37a8; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 5px 22px #0002; }
  .user { background: linear-gradient(135deg, #123d29, #102d20); border-color: #286342; margin-left: auto; }
  .assistant { background: linear-gradient(145deg, #102219, #0c1912); }
  details { font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  pre { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .media { display: block; max-width: 100%; max-height: 70vh; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--line); }
  form {
    display: flex; align-items: flex-end; gap: 10px; padding: 14px clamp(12px, 3vw, 34px) 18px;
    border-top: 1px solid #294b37aa; background: #07120dee; backdrop-filter: blur(18px);
  }
  textarea {
    flex: 1; min-width: 0; max-height: 180px; font: inherit; color: var(--fg); background: #0e1e15;
    border: 1px solid #31543e; border-radius: 15px; padding: 12px 15px; resize: vertical; outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  textarea:focus, #repo:focus, #msel:focus { border-color: var(--accent-strong); box-shadow: 0 0 0 3px #28c96b20; }
  button {
    font: inherit; font-size: 13px; font-weight: 650; border: 1px solid transparent; border-radius: 11px;
    padding: 9px 15px; background: linear-gradient(135deg, #43df82, #1ba95a); color: #04150b;
    cursor: pointer; transition: transform .16s, filter .16s, border-color .16s;
  }
  button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  button.plain { background: transparent; color: var(--muted); border-color: transparent; padding: 7px 10px; }
  button.plain:hover { color: var(--fg); background: #173322; border-color: #2b5a3b; }
  #stop { background: #7f2535; color: #fff; }
  #panel, #mpanel {
    position: absolute; top: 67px; left: 0; right: 0; bottom: 0; z-index: 2; overflow-y: auto;
    background: #09150ff5; backdrop-filter: blur(22px); padding: 16px clamp(14px, 3vw, 36px);
    border-top: 1px solid #244632; box-shadow: var(--shadow);
  }
  h3 { margin: 18px 0 8px; font-size: 14px; color: var(--fg); letter-spacing: .02em; }
  .muted { font-size: 12px; color: var(--muted); margin: 3px 0; }
  .bad { color: var(--danger); font-size: 12px; }
  .q { border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px; margin: 10px 0; background: #0d1d14; }
  .qh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .qh .badge { margin-left: auto; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 99px; color: #dceee2; background: #34473a; }
  .badge.fits { background: #145b35; color: #a6f5c2; } .badge.tight { background: #66501a; color: #ffe4a3; }
  .badge.offload { background: #74421b; color: #ffd0a1; } .badge.no { background: #702b38; color: #ffc0c9; }
  .q button { margin-top: 9px; padding: 7px 13px; }
  .q button:disabled { background: #26352b; color: #84988a; }
  #msg { font-size: 12px; color: var(--danger); min-height: 1em; }
  #repo { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; outline: none; }
  .chip { display: inline-block; font-size: 12px; margin: 6px 7px 0 0; padding: 4px 10px; border-radius: 99px; color: #a9e9bf; background: #123321; border: 1px solid #28553a; cursor: pointer; }
  .chip:hover { background: #19472d; }
  progress { flex: 0 0 90px; accent-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; padding: 10px 5px; border-bottom: 1px solid #24463299; }
  .row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .row small { color: var(--muted); }
  [hidden] { display: none !important; }
  @media (max-width: 700px) {
    header { gap: 5px; padding-inline: 10px; flex-wrap: wrap; }
    .brand { margin-right: 0; }
    .brand img { width: 32px; height: 32px; }
    .brand-name { font-size: 16px; }
    .top-actions { gap: 2px; }
    .top-actions button.plain { padding: 6px; font-size: 12px; }
    #msel { order: 3; flex-basis: 100%; max-width: none; }
    #thinkl { font-size: 12px; }
    #log { padding: 14px; }
    .m { max-width: 100%; }
    form { padding: 10px; gap: 7px; }
    form button { padding: 9px 11px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/buia-mark.svg" alt=""><span class="brand-name">BUIA<span>.</span></span></div>
  <select id="msel" title="Model"></select>
  <label id="thinkl" title="Let the model reason before it answers: slower, uses more context"><input type="checkbox" id="think"> Think</label>
  <nav class="top-actions">
    <button class="plain" id="chats">Chats</button>
    <button class="plain" id="models">Models</button>
    <button class="plain" id="new">New chat</button>
  </nav>
</header>
<div id="status">…</div>
<div id="panel" hidden></div>
<div id="mpanel" hidden>
  <h3>This machine</h3><div id="mhw" class="muted">…</div>
  <h3>Installed</h3><div id="minst"></div>
  <h3>Download a model</h3>
  <input id="repo" placeholder="owner/repo on Hugging Face" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div id="chips"><span class="muted">Examples:</span></div>
  <button id="check" style="margin-top:8px">Check quants</button>
  <div id="msg"></div>
  <div id="mres"></div>
</div>
<div id="log">
  <section id="welcome">
    <img src="/buia-mark.svg" alt="BUIA cat mark">
    <h1>Your <span>standalone</span><br>AI assistant.</h1>
    <p>Private by design. Running on your machine. Ready when you are.</p>
    <div class="welcome-rule"></div>
  </section>
</div>
<form id="f">
  <textarea id="box" rows="2" placeholder="Message (Ctrl+Enter to send)"></textarea>
  <button id="send">Send</button>
  <button id="stop" type="button" hidden>Stop</button>
</form>
<script>
const $ = id => document.getElementById(id);
const log = $('log'), box = $('box'), panel = $('panel');
let chatId = null, ctl = null;
const thinkBox = $('think');
try { thinkBox.checked = localStorage.getItem('buia.think') === '1'; } catch (e) {}  // storage can be blocked: default off
thinkBox.onchange = () => { try { localStorage.setItem('buia.think', thinkBox.checked ? '1' : '0'); } catch (e) {} };

// Split a buffer into complete SSE events; returns [events, remainder].
function takeEvents(buf) {
  const out = []; let i;
  while ((i = buf.indexOf('\n\n')) >= 0) {
    const line = buf.slice(0, i).split('\n').find(l => l.startsWith('data:'));
    buf = buf.slice(i + 2);
    if (line) out.push(JSON.parse(line.slice(5)));
  }
  return [out, buf];
}

function bubble(role) {
  $('welcome').hidden = true;
  const el = document.createElement('div'); el.className = 'm ' + role;
  const det = document.createElement('details'), sum = document.createElement('summary'), pre = document.createElement('pre');
  det.hidden = true; det.append(sum, pre);
  const tdet = document.createElement('details'), tsum = document.createElement('summary'), tpre = document.createElement('pre');
  tdet.hidden = true; tsum.textContent = 'Thinking'; tdet.append(tsum, tpre);
  const mdiv = document.createElement('div');
  const txt = document.createTextNode('');
  el.append(tdet, det, mdiv, txt); log.append(el);
  let n = 0;
  return {
    set(s) { txt.data = s; },
    add(s) { const near = log.scrollHeight - log.scrollTop - log.clientHeight < 80; txt.data += s; if (near) log.scrollTop = log.scrollHeight; },
    think(s) { tdet.hidden = false; tpre.textContent += s; },
    media(m) {  // note: `el` is the bubble here, so no el() helper
      const vid = m.mime.startsWith('video/'), n = document.createElement(vid ? 'video' : 'img');
      n.className = 'media'; n.src = m.url;
      if (vid) n.controls = n.loop = n.muted = n.autoplay = n.playsInline = true; else n.alt = m.prompt || '';
      mdiv.append(n); log.scrollTop = log.scrollHeight;
    },
    tool(t) {
      n++; det.hidden = false; sum.textContent = n + ' tool call' + (n > 1 ? 's' : '');
      const a = typeof t.args === 'string' ? t.args : JSON.stringify(t.args);
      pre.textContent += (pre.textContent ? '\n' : '') + t.tool + '(' + a + ')\n  -> ' + t.result;
    },
  };
}

function setBusy(b) { $('send').hidden = b; $('stop').hidden = !b; }

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) e[k === 'class' ? 'className' : k] = v;
  e.append(...kids); return e;
}
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : 'error ' + r.status);
  return j;
}

// ---------- models: selector, installed list, hardware check, downloader ----------
const mpanel = $('mpanel'), msel = $('msel');
let state = { models: [], selected: null }, hw = null, lastCheck = null, pollTimer = null, hwTick = 0;
const GB = mb => (mb / 1024).toFixed(1) + ' GB';
const size = mb => mb >= 1024 ? GB(mb) : Math.round(mb) + ' MB';
const short = id => id.split('/').slice(1).join('/') || id;
const usable = m => ['loaded', 'loading', 'unloaded', 'sleeping'].includes(m.status) && !m.failed;
const LABEL = { fits: 'fits', tight: 'tight', offload: 'CPU offload', no: 'too big', unknown: 'unknown' };
const EXAMPLES = ['unsloth/Qwen3-4B-Instruct-2507-GGUF', 'ggml-org/gemma-3-4b-it-GGUF', 'unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF'];
const flash = t => { $('msg').textContent = t || ''; };

async function refreshModels(reload = false) {
  try {
    const j = await api('GET', '/api/models' + (reload ? '?reload=1' : ''));
    state = { models: j.models, selected: j.selected };
    renderSelect(); renderStatus(); if (!mpanel.hidden) renderInstalled();
  } catch (e) { $('status').textContent = 'offline'; }
  schedule();
}
function schedule() {
  clearTimeout(pollTimer);
  const busy = state.models.some(m => m.status === 'downloading' || m.status === 'loading');
  if (mpanel.hidden && !busy) return;
  pollTimer = setTimeout(() => { if (!mpanel.hidden && ++hwTick % 4 === 0) refreshHw(); refreshModels(state.models.some(m => m.status === 'downloading')); }, 1500);
}
function renderSelect() {
  const ms = state.models.filter(usable);
  msel.textContent = '';
  if (!ms.length) { msel.append(el('option', { textContent: 'no model installed' })); msel.disabled = true; return; }
  msel.disabled = false;
  for (const m of ms) msel.append(el('option', { value: m.id, textContent: (m.status === 'loaded' ? '● ' : '○ ') + short(m.id) }));
  msel.value = (ms.find(m => m.id === state.selected) || ms.find(m => m.status === 'loaded') || ms[0]).id;
}
function renderStatus() {
  const cur = state.models.find(m => m.id === state.selected) || state.models.find(m => m.status === 'loaded');
  const dl = state.models.find(m => m.status === 'downloading');
  let t = !state.models.length ? 'no model yet: open Models to download one' : !cur ? 'no model selected'
        : cur.status === 'loading' ? 'loading model…' : cur.status === 'loaded' ? 'model ready' : 'model idle (loads on first message)';
  if (dl) t += ' · downloading ' + short(dl.id) + (dl.total ? ' ' + Math.round(100 * (dl.done || 0) / dl.total) + '%' : '');
  $('status').textContent = t;
}
msel.onchange = async () => {
  try { await api('POST', '/api/models/select', { id: msel.value }); } catch (e) { $('status').textContent = e.message; }
  refreshModels();
};

async function act(method, url, body) {
  flash('');
  try { await api(method, url, body); } catch (e) { flash(e.message); }
  refreshModels(true);
}
function renderInstalled() {
  const box = $('minst'); box.textContent = '';
  if (!state.models.length) box.append(el('div', { class: 'muted', textContent: 'Nothing installed yet. Download a model below.' }));
  for (const m of state.models) {
    const row = el('div', { class: 'row' }, el('span', { textContent: short(m.id), title: m.id }));
    if (m.status === 'downloading') {
      row.append(el('progress', m.total ? { max: m.total, value: m.done || 0 } : {}),
                 el('small', { textContent: m.total ? Math.round(100 * (m.done || 0) / m.total) + '%' : '…' }),
                 el('button', { class: 'plain', textContent: 'Cancel', onclick: () => act('POST', '/api/models/cancel', { id: m.id }) }));
    } else if (m.status === 'failed') {
      row.append(el('small', { class: 'bad', textContent: 'download failed: ' + (m.message || '') }),
                 el('button', { class: 'plain', textContent: 'Dismiss', onclick: () => act('POST', '/api/models/dismiss', { id: m.id }) }));
    } else {
      row.append(el('small', { textContent: m.failed ? 'failed to load' : m.status === 'loading' ? 'loading' + (m.progress != null ? ' ' + Math.round(m.progress * 100) + '%' : '…') : m.status === 'loaded' ? 'loaded' : 'idle' }));
      row.append(m.id === state.selected ? el('small', { textContent: '✓ in use' })
                 : el('button', { class: 'plain', textContent: 'Use', onclick: () => act('POST', '/api/models/select', { id: m.id }) }));
      row.append(el('button', { class: 'plain', textContent: '✕', title: 'Delete from disk',
                 onclick: () => { if (confirm('Delete ' + m.id + ' from disk?')) act('DELETE', '/api/models?id=' + encodeURIComponent(m.id)); } }));
    }
    box.append(row);
  }
  if (lastCheck) renderQuants(lastCheck);
}

async function refreshHw() { try { hw = await api('GET', '/api/hardware'); renderHw(); } catch (e) {} }
function renderHw() {
  const b = $('mhw'); b.textContent = '';
  if (!hw) return;
  const g = hw.gpu;
  b.append(el('div', { textContent: g ? `GPU: ${g.name}: ${GB(g.total_mb)} VRAM, ${GB(hw.others_mb)} used by other apps, ${GB(hw.usable_mb)} usable for a model` : 'GPU: not detected (set GPU_VRAM_MB in .env)' }),
           el('div', { textContent: `RAM: ${GB(hw.ram_avail_mb)} available of ${GB(hw.ram_total_mb)} · Disk: ${GB(hw.disk_free_mb)} free` }));
}

async function startDownload(repo, q) {
  let force = false;
  if (q.verdict === 'no') {
    if (!confirm(q.id + ' will not fit.\n' + q.reason + '\nDownload anyway?')) return;
    force = true;
  }
  flash('');
  try { await api('POST', '/api/models/download', { repo, quant: q.tag, force }); } catch (e) { flash(e.message); return; }
  refreshModels(true);
}
function renderQuants(j) {
  const box = $('mres'); box.textContent = '';
  const a = j.arch;
  box.append(el('div', { class: 'muted', textContent: (a ? `${a.arch}, ${a.layers} layers` : 'architecture unreadable: KV cache not included') + ` · estimate for context ${j.ctx}, KV cache ${j.kv_type}` }));
  if (a && a.swa) box.append(el('div', { class: 'muted', textContent: 'Sliding-window attention: the KV estimate is an upper bound.' }));
  for (const q of j.quants) {
    const have = state.models.some(m => m.id.toLowerCase() === q.id.toLowerCase());
    const need = `needs about ${GB(q.need_mb)}` + (j.hardware.usable_mb != null ? ` of ${GB(j.hardware.usable_mb)} usable` : '') + (q.max_ctx != null ? ` · max context about ${Math.floor(q.max_ctx / 1024)}k` : '');
    const btn = el('button', { textContent: have ? 'Installed' : !q.disk_ok ? 'Not enough disk' : q.verdict === 'no' ? 'Download anyway' : 'Download', disabled: have || !q.disk_ok, onclick: () => startDownload(j.repo, q) });
    box.append(el('div', { class: 'q' },
      el('div', { class: 'qh' }, el('b', { textContent: q.tag }), el('span', { textContent: size(q.size_mb) + (q.shards > 1 ? ` (${q.shards} files)` : '') }),
         el('span', { class: 'badge ' + q.verdict, textContent: LABEL[q.verdict] })),
      el('div', { class: 'muted', textContent: need }), el('div', { class: 'muted', textContent: q.reason }), btn));
  }
  box.append(el('div', { class: 'muted', textContent: 'Estimate: weights = file size; KV cache and overhead are approximations (about ±15%).' }));
}
async function runCheck(repo) {
  repo = repo.trim(); if (!repo) return;
  flash(''); $('mres').textContent = 'Checking…';
  try { lastCheck = await api('GET', '/api/hf/quants?repo=' + encodeURIComponent(repo)); renderQuants(lastCheck); }
  catch (e) { lastCheck = null; $('mres').textContent = ''; flash(e.message); }
}
for (const ex of EXAMPLES) $('chips').append(el('span', { class: 'chip', textContent: ex, onclick: () => { $('repo').value = ex; runCheck(ex); } }));
$('check').onclick = () => runCheck($('repo').value);
$('repo').onkeydown = e => { if (e.key === 'Enter') runCheck(e.target.value); };
$('models').onclick = () => {
  panel.hidden = true; mpanel.hidden = !mpanel.hidden;
  if (!mpanel.hidden) { refreshHw(); refreshModels(); renderInstalled(); } else clearTimeout(pollTimer);
};

async function ask(text) {
  bubble('user').set(text);
  const b = bubble('assistant'); b.set('…'); log.scrollTop = log.scrollHeight;
  let started = false, failed = false, aborted = false, gotText = false;
  const first = () => { if (!started) { b.set(''); started = true; } };
  ctl = new AbortController(); setBusy(true);
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                         body: JSON.stringify({ chat_id: chatId, message: text, think: thinkBox.checked }), signal: ctl.signal });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      const [events, rest] = takeEvents(buf + dec.decode(value, { stream: true })); buf = rest;
      for (const ev of events) {
        if (ev.type === 'chat') { chatId = ev.id; history.replaceState(null, '', '#' + ev.id); }
        else if (ev.type === 'delta') { first(); gotText = true; b.add(ev.text); }
        else if (ev.type === 'reasoning') { if (!started) b.set('thinking…'); b.think(ev.text); }
        else if (ev.type === 'tool') b.tool(ev);
        else if (ev.type === 'media') { first(); b.media(ev); }
        else if (ev.type === 'error') { first(); failed = true; b.add('\n[' + ev.message + ']'); }
      }
    }
  } catch (e) {
    first(); aborted = e.name === 'AbortError'; failed = failed || !aborted;
    b.add(aborted ? '\n[stopped]' : '\n[error: ' + e.message + ']');
  } finally {
    if ((failed || aborted) && !gotText) box.value = text;  // no reply was saved: let the user resend
    setBusy(false); ctl = null; refreshModels();
    if ((failed || aborted) && chatId) resync(chatId, text);
  }
}

// A generation job keeps running on the server when the page is closed, the phone sleeps or Stop is pressed, and its result is added
// to the chat when it ends. After a lost connection, check for such a job and show the chat the way the server has it.
async function resync(id, text) {
  for (let i = 0; i < 4 && chatId === id; i++) {
    await new Promise(r => setTimeout(r, 1500));
    if (ctl) return;  // the user already started something else
    const r = await fetch('/api/chats/' + id).catch(() => null);
    if (!r || !r.ok) continue;
    if ((await r.json()).messages.some(m => m.pending)) { if (box.value === text) box.value = ''; await openChat(id); return; }
  }
}

let watching = null;  // chat id being polled for a running generation job
async function watchPending(id) {
  if (watching === id) return;
  watching = id;
  for (;;) {
    await new Promise(r => setTimeout(r, 3000));
    if (chatId !== id) { if (watching === id) watching = null; return; }
    const r = await fetch('/api/chats/' + id).catch(() => null);
    if (r && r.status === 404) { watching = null; return; }
    if (r && r.ok && !(await r.json()).messages.some(m => m.pending)) { watching = null; await openChat(id); return; }
  }
}

function newChat() { chatId = null; history.replaceState(null, '', location.pathname); log.querySelectorAll('.m').forEach(n => n.remove()); $('welcome').hidden = false; panel.hidden = true; mpanel.hidden = true; }

async function openChat(id) {
  const r = await fetch('/api/chats/' + id);
  if (!r.ok) { newChat(); return; }
  const c = await r.json();
  log.querySelectorAll('.m').forEach(n => n.remove()); $('welcome').hidden = c.messages.length > 0; chatId = c.id; history.replaceState(null, '', '#' + c.id);
  for (const m of c.messages) {
    const b = bubble(m.role);
    b.set(m.pending ? (m.content ? m.content + '\n' : '') + '⏳ generating the ' + (m.pending.tool === 'generate_video' ? 'video' : 'image') + '… it will appear here when it is done' : m.content);
    if (m.thinking) b.think(m.thinking);
    (m.trace || []).forEach(t => b.tool(t));
    (m.media || []).forEach(x => b.media(x));
  }
  panel.hidden = true; log.scrollTop = log.scrollHeight;
  if (c.messages.some(m => m.pending)) watchPending(c.id);
}

async function showChats() {
  mpanel.hidden = true;
  if (!panel.hidden) { panel.hidden = true; return; }
  panel.textContent = '';
  const list = await (await fetch('/api/chats')).json();
  if (!list.length) panel.textContent = 'No saved chats yet.';
  for (const c of list) {
    const row = document.createElement('div'), t = document.createElement('span'), d = document.createElement('small'), x = document.createElement('button');
    row.className = 'row'; t.textContent = c.title; d.textContent = c.updated.slice(0, 16).replace('T', ' ');
    x.className = 'plain'; x.textContent = '✕';
    t.onclick = () => openChat(c.id);
    x.onclick = async () => { await fetch('/api/chats/' + c.id, { method: 'DELETE' }); if (c.id === chatId) newChat(); row.remove(); };
    row.append(t, d, x); panel.append(row);
  }
  panel.hidden = false;
}

$('f').onsubmit = e => { e.preventDefault(); const t = box.value.trim(); if (!t || ctl) return; box.value = ''; ask(t); };
box.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('f').requestSubmit(); };
$('stop').onclick = () => ctl && ctl.abort();
$('chats').onclick = showChats;
$('new').onclick = newChat;

refreshModels();
if (location.hash.length > 1) openChat(location.hash.slice(1));
</script>
</body>
